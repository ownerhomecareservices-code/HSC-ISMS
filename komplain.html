<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HCS-ISMS — Komplain & Redo</title>
<style>
:root {
  --navy: #1A3557; --blue: #2C6AA0; --sky: #E8F2FB;
  --green: #1D7A4A; --green-light: #E8F5EE;
  --orange: #C0550A; --orange-light: #FDF0E8;
  --red: #C0392B; --red-light: #FDEDEC;
  --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
  --gray-400: #94A3B8; --gray-600: #475569; --gray-800: #1E293B;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 2px 12px rgba(26,53,87,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; font-size: 14px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; }
.app-header { background: var(--navy); color: white; padding: 14px 18px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
.header-top { display: flex; align-items: center; gap: 12px; }
.btn-back { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: white; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.header-title { font-size: 15px; font-weight: 700; }
.page { display: none; }
.page.active { display: block; }
.content { padding: 16px; }
.card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.4px; margin: 16px 0 8px; }
.section-label:first-child { margin-top: 0; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
.form-label .req { color: var(--red); }
.form-input, .form-select, .form-textarea { width: 100%; padding: 9px 11px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 13px; font-family: inherit; }
.form-textarea { resize: vertical; min-height: 60px; }
.btn { display: block; width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 13.5px; font-weight: 700; cursor: pointer; margin-bottom: 8px; }
.btn-primary { background: var(--blue); color: white; }
.btn-secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
.list-item { border: 1px solid var(--gray-200); border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.list-item:active { background: var(--sky); }
.item-name { font-weight: 700; font-size: 13.5px; color: var(--navy); }
.item-meta { font-size: 11.5px; color: var(--gray-600); margin-top: 2px; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; }
.badge-baru { background: var(--red-light); color: var(--red); }
.badge-selesai { background: var(--green-light); color: var(--green); }
.empty-state { text-align: center; padding: 30px 20px; color: var(--gray-400); }
.fab { position: fixed; bottom: 20px; right: calc(50% - 240px + 20px); background: var(--blue); color: white; width: 52px; height: 52px; border-radius: 50%; border: none; font-size: 24px; box-shadow: var(--shadow); cursor: pointer; z-index: 50; }
@media (max-width: 520px) { .fab { right: 20px; } }
.timeline-item { display: flex; gap: 8px; padding: 6px 0; font-size: 12px; }
.timeline-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); margin-top: 5px; flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">

  <!-- ══ LIST KOMPLAIN ══ -->
  <div class="page active" id="pageList">
    <div class="app-header"><div class="header-title">⚠️ Komplain & Investigasi Redo</div></div>
    <div class="content" id="listContent"><div class="empty-state">Memuat...</div></div>
    <button class="fab" onclick="goPage('pageCreate')">+</button>
  </div>

  <!-- ══ BUAT KOMPLAIN BARU ══ -->
  <div class="page" id="pageCreate">
    <div class="app-header">
      <div class="header-top">
        <button class="btn-back" onclick="goPage('pageList')">←</button>
        <div class="header-title">Buat Komplain Baru</div>
      </div>
    </div>
    <div class="content">
      <div class="card">
        <div class="form-group">
          <label class="form-label">Nomor WO / WO_ID yang Dikomplain <span class="req">*</span></label>
          <input class="form-input" id="cWoId" placeholder="Contoh: WO-000004">
        </div>
        <div class="form-group">
          <label class="form-label">Kategori Sementara</label>
          <select class="form-select" id="cKategori">
            <option value="">— Pilih —</option>
            <option value="HASIL_TIDAK_MEMUASKAN">Hasil Tidak Memuaskan</option>
            <option value="MASALAH_BERULANG">Masalah Berulang</option>
            <option value="SPAREPART_BERMASALAH">Sparepart Bermasalah</option>
            <option value="SIKAP_TEKNISI">Sikap Teknisi</option>
            <option value="LAINNYA">Lainnya</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Kronologi <span class="req">*</span></label>
          <textarea class="form-textarea" id="cKronologi" placeholder="Ceritakan kejadian yang dikomplain customer"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">PIC Penanganan</label>
          <input class="form-input" id="cPIC" placeholder="Nama yang menangani komplain ini">
        </div>
      </div>
      <button class="btn btn-primary" onclick="submitKomplain()">Buat Tiket Komplain</button>
    </div>
  </div>

  <!-- ══ DETAIL INVESTIGASI ══ -->
  <div class="page" id="pageDetail">
    <div class="app-header">
      <div class="header-top">
        <button class="btn-back" onclick="goPage('pageList')">←</button>
        <div class="header-title" id="detailTitle">Investigasi</div>
      </div>
    </div>
    <div class="content" id="detailContent"><div class="empty-state">Memuat...</div></div>
  </div>

</div>

<script src="auth.js"></script>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw_JHWESY0daowfQXifOcEE7MW-ZqSvnV0FWM6qKhE7srEOEbNOPiJlDhvCz1dAKH47/exec';

async function gasGet(action, params) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, v); });
  const res = await fetch(url.toString());
  return res.json();
}
async function gasPost(action, payload) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload)) });
  return res.json();
}
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function goPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'pageList') loadKomplainList();
}

async function loadKomplainList() {
  const content = document.getElementById('listContent');
  content.innerHTML = '<div class="empty-state">Memuat...</div>';
  const r = await gasGet('listKomplain', {});
  if (!r.success) { content.innerHTML = `<div class="empty-state">${r.error}</div>`; return; }
  if (!r.data.length) { content.innerHTML = '<div class="empty-state">Belum ada komplain tercatat.<br>Tekan + untuk buat tiket baru.</div>'; return; }
  content.innerHTML = r.data.map(k => `
    <div class="list-item" onclick="openDetail('${k.Komplain_ID}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="item-name">${escapeHtml(k.customerNama || k.WO_Referensi)}</div>
        <span class="badge ${k.Status === 'BARU' ? 'badge-baru' : 'badge-selesai'}">${escapeHtml(k.Status)}</span>
      </div>
      <div class="item-meta">${escapeHtml(k.nomorWOAsal || k.WO_Referensi)} · ${escapeHtml(k.Kategori_Sementara || '-')}</div>
      <div class="item-meta">${escapeHtml(k.Tanggal_Komplain)}</div>
    </div>
  `).join('');
}

async function submitKomplain() {
  const woId = document.getElementById('cWoId').value.trim();
  const kronologi = document.getElementById('cKronologi').value.trim();
  if (!woId) { alert('WO yang dikomplain wajib diisi'); return; }
  if (!kronologi) { alert('Kronologi wajib diisi'); return; }
  const r = await gasPost('createKomplain', {
    woReferensi: woId,
    kategoriSementara: document.getElementById('cKategori').value,
    kronologi: kronologi,
    pic: document.getElementById('cPIC').value,
  });
  if (!r.success) { alert('Gagal: ' + r.error); return; }
  document.getElementById('cWoId').value = ''; document.getElementById('cKronologi').value = '';
  document.getElementById('cPIC').value = ''; document.getElementById('cKategori').value = '';
  goPage('pageList');
}

async function openDetail(komplainId) {
  goPage('pageDetail');
  const content = document.getElementById('detailContent');
  content.innerHTML = '<div class="empty-state">Memuat...</div>';
  const r = await gasGet('getInvestigasiData', { komplainId });
  if (!r.success) { content.innerHTML = `<div class="empty-state">${r.error}</div>`; return; }
  const d = r.data;
  document.getElementById('detailTitle').textContent = d.komplain.Komplain_ID;

  const wo = d.woAsal.wo;
  const customer = d.woAsal.customer;

  let html = `
    <div class="section-label">Komplain</div>
    <div class="card">
      <div style="font-size:13px">${escapeHtml(d.komplain.Kronologi)}</div>
      <div class="item-meta" style="margin-top:6px">Kategori: ${escapeHtml(d.komplain.Kategori_Sementara || '-')} · ${escapeHtml(d.komplain.Tanggal_Komplain)}</div>
    </div>

    <div class="section-label">WO Asal yang Dikomplain</div>
    <div class="card">
      <div style="font-size:13px"><b>${escapeHtml(customer?.Nama_Customer)}</b></div>
      <div class="item-meta">${escapeHtml(wo.Nomor_WO)} · ${escapeHtml(wo.Jenis_Pekerjaan_ID)} · ${escapeHtml(String(wo.Tanggal_WO).slice(0,10))}</div>
      <div class="item-meta">Teknisi: ${escapeHtml(d.woAsal.teknisiUtama?.Nama || '-')}</div>
    </div>

    <div class="section-label">Riwayat Pemeriksaan WO Asal (untuk ditinjau)</div>
    <div class="card">
      <div class="timeline-item"><div class="timeline-dot"></div><div>Keluhan: ${d.woAsal.keluhan.map(k => escapeHtml(k.Kode_Keluhan)).join(', ') || '-'}</div></div>
      <div class="timeline-item"><div class="timeline-dot"></div><div>Diagnosis: ${escapeHtml(d.woAsal.diagnosis[0]?.Temuan_Teknisi || 'Tidak ada diagnosis tercatat')}</div></div>
      <div class="timeline-item"><div class="timeline-dot"></div><div>Hasil Perbaikan: ${d.woAsal.hasilPerbaikan.length} tindakan tercatat</div></div>
      <div class="timeline-item"><div class="timeline-dot"></div><div>Sparepart: ${d.woAsal.sparepartUsage.map(s => escapeHtml(s.Nama_Sparepart_Snapshot)).join(', ') || 'Tidak ada'}</div></div>
      <div class="timeline-item"><div class="timeline-dot"></div><div>Final Test: ${escapeHtml(d.woAsal.finalTest[0]?.Status_Final_Test || '-')}</div></div>
    </div>
  `;

  if (d.investigasi) {
    html += `
      <div class="section-label">Hasil Investigasi</div>
      <div class="card" style="background:var(--green-light);border-color:var(--green-light)">
        <div style="font-size:13px"><b>Kategori Penyebab:</b> ${escapeHtml(d.investigasi.Kategori_Penyebab)}</div>
        <div style="font-size:13px;margin-top:4px"><b>Hasil:</b> ${escapeHtml(d.investigasi.Hasil_Investigasi)}</div>
        <div style="font-size:13px;margin-top:4px"><b>Penanggung Jawab:</b> ${escapeHtml(d.investigasi.Penanggung_Jawab || '-')}</div>
        <div style="font-size:13px;margin-top:4px"><b>Tindakan Korektif:</b> ${escapeHtml(d.investigasi.Tindakan_Korektif || '-')}</div>
      </div>
    `;
  } else {
    html += `
      <div class="section-label">Isi Hasil Investigasi</div>
      <div class="card">
        <div class="form-group">
          <label class="form-label">Kategori Penyebab Redo <span class="req">*</span></label>
          <select class="form-select" id="invKategori">
            <option value="DIAGNOSIS_TIDAK_TEPAT">Diagnosis Tidak Tepat</option>
            <option value="PEMERIKSAAN_TIDAK_LENGKAP">Pemeriksaan Tidak Lengkap</option>
            <option value="SOP_TIDAK_DIJALANKAN">SOP Tidak Dijalankan</option>
            <option value="PARAMETER_TIDAK_DIUKUR">Parameter Tidak Diukur</option>
            <option value="PERBAIKAN_TIDAK_SESUAI">Perbaikan Tidak Sesuai</option>
            <option value="INSTALASI_TIDAK_SESUAI">Instalasi Tidak Sesuai</option>
            <option value="SPAREPART_BERMASALAH">Sparepart Bermasalah</option>
            <option value="KERUSAKAN_LANJUTAN">Kerusakan Lanjutan</option>
            <option value="KERUSAKAN_BARU">Kerusakan Baru</option>
            <option value="CUSTOMER_MISUSE">Customer Misuse</option>
            <option value="FAKTOR_EKSTERNAL">Faktor Eksternal</option>
            <option value="PEKERJAAN_PIHAK_LAIN">Pekerjaan Pihak Lain</option>
            <option value="INFORMASI_CUSTOMER_TIDAK_LENGKAP">Informasi Customer Tidak Lengkap</option>
            <option value="TIDAK_DAPAT_DISIMPULKAN">Tidak Dapat Disimpulkan</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Hasil Investigasi <span class="req">*</span></label>
          <textarea class="form-textarea" id="invHasil" placeholder="Kesimpulan dari peninjauan riwayat WO di atas"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Hasil Keputusan</label>
          <select class="form-select" id="invKeputusan">
            <option value="REDO_TEKNISI">Redo oleh Teknisi (gratis)</option>
            <option value="GARANSI_SPAREPART">Garansi Sparepart</option>
            <option value="PEKERJAAN_LANJUTAN">Pekerjaan Lanjutan</option>
            <option value="KERUSAKAN_BARU">Kerusakan Baru (chargeable)</option>
            <option value="BUKAN_TANGGUNG_JAWAB_HCS">Bukan Tanggung Jawab HCS</option>
            <option value="GOODWILL_SERVICE">Goodwill Service</option>
            <option value="CHARGEABLE_SERVICE">Chargeable Service</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Penanggung Jawab</label>
          <input class="form-input" id="invPenanggungJawab" placeholder="Nama teknisi/pihak bertanggung jawab">
        </div>
        <div class="form-group">
          <label class="form-label">Tindakan Korektif</label>
          <textarea class="form-textarea" id="invTindakanKorektif" placeholder="Apa yang akan dilakukan supaya tidak terulang"></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitInvestigasi('${komplainId}')">Simpan Hasil Investigasi</button>
      </div>
    `;
  }

  document.getElementById('detailContent').innerHTML = html;
}

async function submitInvestigasi(komplainId) {
  const hasilInvestigasi = document.getElementById('invHasil').value.trim();
  if (!hasilInvestigasi) { alert('Hasil investigasi wajib diisi'); return; }
  const keputusan = document.getElementById('invKeputusan').value;
  const r = await gasPost('saveRedoInvestigation', {
    komplainId,
    kategoriPenyebab: document.getElementById('invKategori').value,
    hasilInvestigasi,
    penanggungJawab: document.getElementById('invPenanggungJawab').value,
    tindakanKorektif: document.getElementById('invTindakanKorektif').value,
    catatan: 'Keputusan: ' + keputusan,
  });
  if (!r.success) { alert('Gagal: ' + r.error); return; }
  openDetail(komplainId);
}

Auth.requireLogin(["ROLE-SUPERVISOR", "ROLE-OWNER", "ROLE-ADMIN"]).then(() => {
  loadKomplainList();
});
</script>
</body>
</html>
