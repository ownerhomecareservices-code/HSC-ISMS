<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HCS-ISMS — Laporan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --navy: #1A3557; --blue: #2C6AA0; --sky: #E8F2FB;
  --green: #1D7A4A; --green-light: #E8F5EE;
  --red: #C0392B; --red-light: #FDEDEC;
  --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
  --gray-400: #94A3B8; --gray-600: #475569; --gray-800: #1E293B;
  --radius: 12px; --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(26,53,87,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; font-size: 14px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; }
.app-header { background: var(--navy); color: white; padding: 16px 18px; box-shadow: var(--shadow); }
.header-title { font-size: 16px; font-weight: 700; }
.header-sub { font-size: 12px; opacity: 0.75; margin-top: 2px; }
.content { padding: 16px; }
.card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.4px; margin: 16px 0 8px; }
.section-label:first-child { margin-top: 0; }
.btn { display: block; width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; margin-bottom: 10px; }
.btn-primary { background: var(--blue); color: white; }
.btn-secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
.btn-wa { background: #25D366; color: white; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--gray-400); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--gray-800); color: white; padding: 10px 18px; border-radius: 24px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="app-header">
    <div class="header-title">📄 Laporan Work Order</div>
    <div class="header-sub" id="headerNomorWO">Memuat...</div>
  </div>
  <div class="content">
    <div class="section-label">Buka Work Order</div>
    <div class="card">
      <input class="btn" style="text-align:left;font-weight:400;border:1.5px solid var(--gray-200);cursor:text" id="loadWoId" placeholder="Masukkan WO_ID, contoh: WO-000001">
      <button class="btn btn-primary" onclick="loadReportData()">Muat Data</button>
    </div>

    <div id="mainContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="auth.js"></script>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjdx0xB0Bi-McWDOBTgAgc-ul2wKr2M_ezZhB3Lf3O17EgJthzaR1WoHElYroPMs-cVQ/exec';
let R = null; // report data
let woId = null;

async function gasGet(action, params) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, v); });
  const res = await fetch(url.toString());
  return res.json();
}
async function gasPost(action, payload) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload)) });
  return res.json();
}
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadReportData() {
  woId = document.getElementById('loadWoId').value.trim();
  if (!woId) { showToast('Masukkan WO_ID dulu'); return; }
  document.getElementById('mainContent').innerHTML = '<div class="empty-state">Memuat...</div>';
  const r = await gasGet('getWOFullReportData', { woId });
  if (!r.success) { document.getElementById('mainContent').innerHTML = `<div class="empty-state">${r.error}</div>`; return; }
  R = r.data;
  document.getElementById('headerNomorWO').textContent = R.wo.Nomor_WO || R.wo.WO_ID;
  renderMainContent();
}

function renderMainContent() {
  document.getElementById('mainContent').innerHTML = `
    <div class="section-label">Ringkasan</div>
    <div class="card">
      <div><b>${escapeHtml(R.customer?.Nama_Customer)}</b></div>
      <div style="font-size:12.5px;color:var(--gray-600)">${escapeHtml(R.units[0]?.Jenis_Unit_ID || 'Tanpa unit')} · ${escapeHtml(R.wo.Jenis_Pekerjaan_ID)}${R.wo.Layanan_Tambahan ? ' + 🧴 ' + escapeHtml(R.wo.Layanan_Tambahan) : ''}</div>
      <div style="font-size:11px;color:var(--gray-400);margin-top:4px">${escapeHtml(String(R.wo.Tanggal_WO).slice(0,10))} · Status: ${escapeHtml(R.wo.Status_WO)}</div>
    </div>

    <div class="section-label">Cetak Laporan</div>
    <button class="btn btn-primary" onclick="generatePDF('customer')">📄 Buat & Download Laporan Customer</button>
    <button class="btn btn-secondary" onclick="generatePDF('internal')">🗂️ Buat & Download Laporan Internal</button>

    <div class="section-label">Bagikan</div>
    <button class="btn btn-wa" onclick="shareWA()">💬 Kirim Link WA ke Customer</button>

    <div id="pdfStatus" style="font-size:12px;color:var(--gray-600);text-align:center;margin-top:6px"></div>
  `;
}

// ═══════════════════════════════════════════════════════
// GENERATE PDF (client-side, jsPDF — sama seperti app lama)
// ═══════════════════════════════════════════════════════
function generatePDF(jenis) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const margin = 15;
  let y = margin;
  const pageW = doc.internal.pageSize.getWidth();

  function title(text, size) { doc.setFontSize(size || 14); doc.setFont(undefined, 'bold'); doc.text(text, margin, y); y += size ? size * 0.6 : 8; doc.setFont(undefined, 'normal'); }
  function row(label, value) {
    if (y > 280) { doc.addPage(); y = margin; }
    doc.setFontSize(9.5);
    doc.setTextColor(100);
    doc.text(String(label), margin, y);
    doc.setTextColor(20);
    doc.text(String(value || '-'), margin + 55, y);
    y += 6;
  }
  function addLine() { doc.setDrawColor(220); doc.line(margin, y, pageW - margin, y); y += 5; }
  function checkPage() { if (y > 275) { doc.addPage(); y = margin; } }

  // Header
  doc.setFillColor(26, 53, 87);
  doc.rect(0, 0, pageW, 22, 'F');
  doc.setTextColor(255);
  doc.setFontSize(15); doc.setFont(undefined, 'bold');
  doc.text('HOME CARE SERVICES', margin, 13);
  doc.setFontSize(9); doc.setFont(undefined, 'normal');
  doc.text(jenis === 'internal' ? 'LAPORAN INTERNAL' : 'LAPORAN PEKERJAAN CUSTOMER', margin, 19);
  doc.setTextColor(20);
  y = 30;

  title('Informasi Work Order', 12);
  row('Nomor WO', R.wo.Nomor_WO || R.wo.WO_ID);
  row('Tanggal', String(R.wo.Tanggal_WO).slice(0, 10));
  row('Jenis Pekerjaan', R.wo.Jenis_Pekerjaan_ID);
  if (R.wo.Layanan_Tambahan) row('Layanan Tambahan', R.wo.Layanan_Tambahan);
  row('Status', R.wo.Status_WO);
  y += 2; addLine();

  title('Data Customer', 12);
  row('Nama', R.customer?.Nama_Customer);
  row('Telepon', R.customer?.Nomor_Telepon);
  row('Alamat', R.customer?.Alamat);
  y += 2; addLine();

  if (R.units.length) {
    title('Data Unit', 12);
    R.units.forEach(u => {
      row('Jenis Unit', u.Jenis_Unit_ID + (u.Subjenis_Unit_ID ? ' - ' + u.Subjenis_Unit_ID : ''));
      row('Merk / Model', (u.Merk || '-') + ' / ' + (u.Model || '-'));
      row('Lokasi', u.Lokasi_Unit);
    });
    y += 2; addLine();
  }

  checkPage();
  if (R.keluhan.length) {
    title('Keluhan Customer', 12);
    R.keluhan.forEach(k => { row(k.Kode_Keluhan, k.Deskripsi || ''); });
    y += 2; addLine();
  }

  checkPage();
  if (R.diagnosis.length) {
    title('Diagnosis Teknisi', 12);
    const d = R.diagnosis[0];
    row('Temuan', d.Temuan_Teknisi);
    row('Analisa Penyebab', d.Analisa_Penyebab);
    if (jenis === 'internal') row('Akar Penyebab', d.Akar_Penyebab);
    row('Rencana Tindakan', d.Rencana_Tindakan);
    y += 2; addLine();
  }

  checkPage();
  if (R.hasilPerbaikan.length) {
    title('Hasil Perbaikan', 12);
    R.hasilPerbaikan.forEach(p => { row(p.Tindakan_ID, p.Hasil_Tindakan || p.Area_Pekerjaan); });
    y += 2; addLine();
  }

  checkPage();
  if (R.sparepartUsage.length) {
    title('Sparepart Digunakan', 12);
    R.sparepartUsage.forEach(s => {
      row(s.Nama_Sparepart_Snapshot, `${s.Qty} ${s.Satuan} — ${s.Kondisi_Sparepart}` + (jenis === 'internal' ? ` — Rp${Number(s.Total_Harga || 0).toLocaleString('id-ID')}` : ''));
    });
    y += 2; addLine();
  }

  checkPage();
  if (R.parameterBanding.length) {
    title('Perbandingan Parameter Awal & Akhir', 12);
    R.parameterBanding.forEach(p => {
      row(p.namaParameter, `${p.nilaiAwal || '-'} → ${p.nilaiAkhir || '-'} ${p.satuan || ''}`);
    });
    y += 2; addLine();
  }

  checkPage();
  if (R.finalTest.length) {
    title('Final Test', 12);
    row('Status', R.finalTest[0].Status_Final_Test);
    if (R.finalTest[0].Catatan) row('Catatan', R.finalTest[0].Catatan);
    y += 2; addLine();
  }

  checkPage();
  if (R.rekomendasi.length) {
    title('Rekomendasi Teknisi', 12);
    const rk = R.rekomendasi[0];
    row('Kondisi Unit', rk.Kondisi_Unit);
    row('Rekomendasi', rk.Rekomendasi_Tindakan);
    if (rk.Rekomendasi_Waktu_Service) row('Servis Berikutnya', rk.Rekomendasi_Waktu_Service);
    y += 2; addLine();
  }

  checkPage();
  title('Teknisi Pelaksana', 12);
  row('Nama', R.teknisiUtama?.Nama);
  if (R.helper) row('Helper', R.helper.Nama);

  // simpan PDF sebagai output & tampilkan tombol simpan ke Drive
  const pdfBlob = doc.output('blob');
  const fileName = `Laporan_${R.wo.Nomor_WO || R.wo.WO_ID}_${jenis}.pdf`;
  doc.save(fileName);

  // upload otomatis ke Drive juga (biar tersimpan & bisa dishare linknya)
  uploadPdfToDrive(pdfBlob, jenis);
}

function uploadPdfToDrive(blob, jenis) {
  const reader = new FileReader();
  reader.onload = async function() {
    const base64 = reader.result.split(',')[1];
    document.getElementById('pdfStatus').textContent = 'Menyimpan salinan ke Drive...';
    const r = await gasPost('simpanLaporanPDF', { woId, pdfBase64: base64, jenisLaporan: jenis, uploadedBy: R.teknisiUtama?.User_ID });
    if (r.success) {
      document.getElementById('pdfStatus').innerHTML = `✅ Tersimpan di Drive — <a href="${r.fileUrl}" target="_blank">buka link</a>`;
      window._lastReportUrl = r.fileUrl;
    } else {
      document.getElementById('pdfStatus').textContent = 'Gagal simpan ke Drive: ' + r.error;
    }
  };
  reader.readAsDataURL(blob);
}

function shareWA() {
  if (!R) { showToast('Muat data WO dulu'); return; }
  const hp = (R.customer?.Nomor_Telepon || '').replace(/\D/g, '');
  if (!hp) { showToast('Nomor HP customer tidak tersedia'); return; }
  let noWA = hp.startsWith('0') ? '62' + hp.slice(1) : (hp.startsWith('62') ? hp : '62' + hp);
  const linkText = window._lastReportUrl ? `\n\nLink laporan: ${window._lastReportUrl}` : '\n\n(Buat laporan PDF dulu sebelum kirim link)';
  const pesan = `Halo *${R.customer.Nama_Customer}*,\n\nTerima kasih sudah menggunakan layanan Home Care Services untuk WO ${R.wo.Nomor_WO || R.wo.WO_ID}.\n\nBerikut ringkasan pekerjaan:\n${R.rekomendasi[0] ? '• Kondisi unit: ' + R.rekomendasi[0].Kondisi_Unit : ''}\n${R.rekomendasi[0]?.Rekomendasi_Tindakan ? '• Rekomendasi: ' + R.rekomendasi[0].Rekomendasi_Tindakan : ''}${linkText}\n\nTerima kasih 🙏\n_Home Care Services_`;
  window.open(`https://wa.me/${noWA}?text=${encodeURIComponent(pesan)}`, '_blank');
}

// muat WO dari parameter URL kalau ada (?wo=WO-000001)
Auth.requireLogin(['ROLE-ADMIN', 'ROLE-TEKNISI', 'ROLE-SUPERVISOR', 'ROLE-OWNER']).then(() => {
  const params = new URLSearchParams(window.location.search);
  const wo = params.get('wo');
  if (wo) { document.getElementById('loadWoId').value = wo; loadReportData(); }
  else { document.getElementById('mainContent').innerHTML = '<div class="empty-state">Masukkan WO_ID untuk mulai</div>'; }
});
</script>
</body>
</html>
