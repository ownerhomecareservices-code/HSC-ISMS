<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HCS-ISMS — Kelola Tim</title>
<style>
:root {
  --navy: #1A3557; --blue: #2C6AA0; --sky: #E8F2FB;
  --green: #1D7A4A; --green-light: #E8F5EE;
  --orange: #C0550A; --orange-light: #FDF0E8;
  --red: #C0392B; --red-light: #FDEDEC;
  --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0;
  --gray-400: #94A3B8; --gray-600: #475569; --gray-800: #1E293B;
  --radius: 12px; --radius-sm: 8px; --shadow: 0 2px 12px rgba(26,53,87,0.10);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-100); color: var(--gray-800); min-height: 100vh; font-size: 14px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; }
.app-header { background: var(--navy); color: white; padding: 16px 18px; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10; }
.header-title { font-size: 16px; font-weight: 700; }
.content { padding: 16px; }
.card { background: white; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.section-label { font-size: 11px; font-weight: 700; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.4px; margin: 16px 0 8px; }
.section-label:first-child { margin-top: 0; }
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
.form-input, .form-select { width: 100%; padding: 9px 11px; border: 1.5px solid var(--gray-200); border-radius: 8px; font-size: 13px; }
.form-row { display: flex; gap: 10px; }
.form-row > .form-group { flex: 1; }
.btn { display: block; width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--blue); color: white; }
.btn-secondary { background: white; color: var(--navy); border: 1.5px solid var(--navy); }
.btn-danger { background: var(--red-light); color: var(--red); border: 1.5px solid var(--red-light); }
.user-item { border: 1px solid var(--gray-200); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
.user-name { font-weight: 700; font-size: 13.5px; color: var(--navy); }
.user-meta { font-size: 11.5px; color: var(--gray-600); margin-top: 2px; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; }
.badge-role { background: var(--sky); color: var(--blue); }
.badge-nonaktif { background: var(--red-light); color: var(--red); }
.empty-state { text-align: center; padding: 30px 20px; color: var(--gray-400); }
.warn-box { background: var(--orange-light); border: 1px solid var(--orange-light); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--orange); margin-bottom: 10px; display: none; }
.fab { position: fixed; bottom: 20px; right: calc(50% - 240px + 20px); background: var(--blue); color: white; width: 52px; height: 52px; border-radius: 50%; border: none; font-size: 24px; box-shadow: var(--shadow); cursor: pointer; z-index: 50; }
@media (max-width: 520px) { .fab { right: 20px; } }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal-box { background: white; border-radius: 16px 16px 0 0; padding: 20px 16px; width: 100%; max-width: 480px; margin: 0 auto; max-height: 88vh; overflow-y: auto; }
</style>
</head>
<body>
<div id="app">
  <div class="app-header"><div class="header-title">👥 Kelola Tim</div></div>
  <div class="content" id="content"><div class="empty-state">Memuat...</div></div>
  <button class="fab" onclick="openAddModal()">+</button>
</div>

<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="section-label">Tambah Anggota Tim Baru</div>
    <div class="warn-box" id="warnMirip"></div>
    <div class="form-group">
      <label class="form-label">Nama <span style="color:var(--red)">*</span></label>
      <input class="form-input" id="newNama" oninput="cekNamaMirip()">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Role <span style="color:var(--red)">*</span></label>
        <select class="form-select" id="newRole" onchange="cekNamaMirip()">
          <option value="ROLE-TEKNISI">Teknisi</option>
          <option value="ROLE-HELPER">Helper</option>
          <option value="ROLE-SUPERVISOR">Supervisor / Kepala Teknisi</option>
          <option value="ROLE-ADMIN">Admin</option>
          <option value="ROLE-OWNER">Owner / Management</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">No. HP</label>
        <input class="form-input" id="newHp" type="tel">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">PIN Login</label>
      <input class="form-input" id="newPin" placeholder="Kosongkan untuk PIN otomatis" maxlength="6">
    </div>
    <button class="btn btn-primary" onclick="submitTambahAnggota()">Simpan</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="closeModal('addModal')">Batal</button>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="section-label">Edit Anggota Tim</div>
    <div class="form-group">
      <label class="form-label">Nama</label>
      <input class="form-input" id="editNama">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-select" id="editRole">
          <option value="ROLE-TEKNISI">Teknisi</option>
          <option value="ROLE-HELPER">Helper</option>
          <option value="ROLE-SUPERVISOR">Supervisor / Kepala Teknisi</option>
          <option value="ROLE-ADMIN">Admin</option>
          <option value="ROLE-OWNER">Owner / Management</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">No. HP</label>
        <input class="form-input" id="editHp" type="tel">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">PIN Login</label>
      <input class="form-input" id="editPin" maxlength="6">
    </div>
    <button class="btn btn-primary" id="btnSaveEdit" onclick="submitEditAnggota()">Simpan Perubahan</button>
    <button class="btn btn-danger" style="margin-top:8px" id="btnToggleAktif" onclick="submitToggleAktif()">Nonaktifkan</button>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="closeModal('editModal')">Batal</button>
  </div>
</div>

<script src="auth.js"></script>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw_JHWESY0daowfQXifOcEE7MW-ZqSvnV0FWM6qKhE7srEOEbNOPiJlDhvCz1dAKH47/exec';
let _editingUserId = null;
let _editingAktif = 'Ya';

async function gasGet(action, params) {
  const url = new URL(GAS_URL);
  url.searchParams.set('action', action);
  Object.entries(params || {}).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.set(k, v); });
  const res = await fetch(url.toString());
  return res.json();
}
async function gasPost(action, payload) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action }, payload)) });
  return res.json();
}
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openAddModal() {
  document.getElementById('newNama').value = ''; document.getElementById('newHp').value = '';
  document.getElementById('newPin').value = ''; document.getElementById('warnMirip').style.display = 'none';
  document.getElementById('addModal').classList.add('show');
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

let _cekTimer;
function cekNamaMirip() {
  clearTimeout(_cekTimer);
  _cekTimer = setTimeout(async () => {
    const nama = document.getElementById('newNama').value.trim();
    const roleId = document.getElementById('newRole').value;
    const warnBox = document.getElementById('warnMirip');
    if (nama.length < 2) { warnBox.style.display = 'none'; return; }
    const r = await gasGet('checkNamaMirip', { nama, roleId });
    if (r.success && r.mirip.length) {
      warnBox.style.display = 'block';
      warnBox.innerHTML = `⚠️ Sudah ada nama mirip terdaftar: <b>${r.mirip.map(escapeHtml).join(', ')}</b>. Pastikan ini bukan orang yang sama sebelum lanjut.`;
    } else {
      warnBox.style.display = 'none';
    }
  }, 400);
}

async function loadTeam() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty-state">Memuat...</div>';
  const r = await gasGet('listAllUsers', {});
  if (!r.success) { content.innerHTML = `<div class="empty-state">${r.error}</div>`; return; }
  if (!r.data.length) { content.innerHTML = '<div class="empty-state">Belum ada anggota tim. Tekan + untuk tambah.</div>'; return; }

  const groups = {};
  r.data.forEach(u => { (groups[u.roleNama] = groups[u.roleNama] || []).push(u); });

  content.innerHTML = Object.keys(groups).map(roleNama => `
    <div class="section-label">${escapeHtml(roleNama)}</div>
    ${groups[roleNama].map(u => `
      <div class="user-item" onclick='openEditModal(${JSON.stringify(u).replace(/'/g,"&#39;")})'>
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="user-name">${escapeHtml(u.Nama)}</div>
            <div class="user-meta">PIN: ${escapeHtml(u.PIN || '-')} · ${escapeHtml(u.Nomor_HP || 'Tanpa No. HP')}</div>
          </div>
          ${u.Aktif !== 'Ya' ? '<span class="badge badge-nonaktif">Nonaktif</span>' : ''}
        </div>
      </div>
    `).join('')}
  `).join('');
}

function openEditModal(u) {
  _editingUserId = u.User_ID;
  _editingAktif = u.Aktif;
  document.getElementById('editNama').value = u.Nama;
  document.getElementById('editRole').value = u.Role_ID;
  document.getElementById('editHp').value = u.Nomor_HP || '';
  document.getElementById('editPin').value = u.PIN || '';
  document.getElementById('btnToggleAktif').textContent = u.Aktif === 'Ya' ? 'Nonaktifkan' : 'Aktifkan Kembali';
  document.getElementById('editModal').classList.add('show');
}

async function submitEditAnggota() {
  const r = await gasPost('updateUserFull', {
    userId: _editingUserId,
    nama: document.getElementById('editNama').value.trim(),
    roleId: document.getElementById('editRole').value,
    nomorHp: document.getElementById('editHp').value.trim(),
    pin: document.getElementById('editPin').value.trim(),
  });
  if (!r.success) { alert('Gagal: ' + r.error); return; }
  closeModal('editModal');
  loadTeam();
}

async function submitToggleAktif() {
  const aktifBaru = _editingAktif === 'Ya' ? 'Tidak' : 'Ya';
  const r = await gasPost('updateUserFull', { userId: _editingUserId, aktif: aktifBaru });
  if (!r.success) { alert('Gagal: ' + r.error); return; }
  closeModal('editModal');
  loadTeam();
}

async function submitTambahAnggota() {
  const nama = document.getElementById('newNama').value.trim();
  if (!nama) { alert('Nama wajib diisi'); return; }
  const r = await gasPost('tambahAnggotaTim', {
    nama,
    roleId: document.getElementById('newRole').value,
    nomorHp: document.getElementById('newHp').value.trim(),
    pin: document.getElementById('newPin').value.trim(),
  });
  if (!r.success) { alert('Gagal: ' + r.error); return; }
  closeModal('addModal');
  alert(`✅ "${nama}" berhasil ditambahkan.\n\nPIN login: ${r.pin}\n\nCatat & kasih tahu PIN ini ke orangnya.`);
  loadTeam();
}

Auth.requireLogin(['ROLE-ADMIN', 'ROLE-OWNER']).then(() => {
  loadTeam();
});
</script>
</body>
</html>
